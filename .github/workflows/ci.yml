name: LOKAHI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Core Unit Tests (32 Tests)
      run: |
        python tests/test_core.py

    - name: Run Interactive Gateway Demo (11 Scenarios)
      run: |
        python demo.py

    - name: Run Red-Team Benchmark & Baseline Harness (50 Adversarial + 200 Benign)
      run: |
        python tools/run_evals.py
