[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lokahi-protocol"
version = "1.1.0"
description = "Multi-layered cascading enforcement runtime for autonomous agent collectives: WASM deterministic pre-flight, SLM semantic judges, Ed25519 consent, fail-secure state, and WebXR teleoperation fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salik Shah" },
  { name = "Sabin Ranjit" },
]
keywords = [
  "ai-safety",
  "multi-agent",
  "boundaries",
  "mcp-gateway",
  "cooperative-ai",
  "ahimsa",
  "astra",
  "governance",
  "wasm",
  "consent",
  "webxr",
]
dependencies = [
  "cryptography>=42.0",
]

[project.optional-dependencies]
wasm = ["wasmtime>=15.0"]
slm = [
  "onnxruntime>=1.17",
  "llama-cpp-python>=0.2",
  "mlx-lm>=0.5",
]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Dirgha-AI/lokahi"
Repository = "https://github.com/Dirgha-AI/lokahi"
Documentation = "https://github.com/Dirgha-AI/lokahi#readme"

[project.scripts]
lokahi-sign = "tools.lokahi_sign:main"
lokahi-approve = "tools.lokahi_approve:main"
lokahi-gateway = "tools.mcp_stdio_proxy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.decisions" = ["model.json"]
