[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lokahi"
version = "1.2.0"
description = "Model Context Protocol (MCP) runtime security gate and deterministic policy firewall for AI agents. Fail-closed: silence means no."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Salik Shah", email = "salik.shah@gmail.com"}
]
maintainers = [
  {name = "Sabin Ranjit"}
]
keywords = [
  "ai-safety",
  "ai-agents",
  "mcp",
  "model-context-protocol",
  "mcp-gateway",
  "mcp-security",
  "claude-code",
  "cursor",
  "policy-engine",
  "guardrails",
  "consent",
  "ahimsa",
  "ed25519",
  "wasm",
  "runtime-security"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
# The rule engine and MCP gate have no dependencies. Extras add optional layers.
dependencies = []

[project.optional-dependencies]
signatures = ["cryptography>=42.0"]
wasm = ["wasmtime>=15.0"]
slm = ["onnxruntime>=1.17", "llama-cpp-python>=0.2", "mlx-lm>=0.5"]
all = ["cryptography>=42.0", "wasmtime>=15.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Dirgha-AI/lokahi"
Repository = "https://github.com/Dirgha-AI/lokahi"
Changelog = "https://github.com/Dirgha-AI/lokahi/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dirgha-AI/lokahi/issues"

[project.scripts]
lokahi-gate = "lokahi.mcp_stdio_proxy:main"
lokahi-gateway = "lokahi.mcp_stdio_proxy:main"
lokahi-sign = "lokahi.lokahi_sign:main"
lokahi-approve = "lokahi.lokahi_approve:main"
lokahi-conformance = "lokahi.conformance:main"

[tool.setuptools]
package-dir = {"lokahi" = "tools"}
packages = ["lokahi", "lokahi.decisions"]

[tool.setuptools.package-data]
"lokahi.decisions" = ["model.json"]
