[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lokahi"
version = "1.3.1"
description = "Model Context Protocol (MCP) runtime security gate and deterministic policy firewall for AI agents. Fail-closed: silence means no."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Salik Shah", email = "salik.shah@gmail.com" },
]
maintainers = [
  { name = "Sabin Ranjit" },
]
keywords = [
  "ai-safety",
  "multi-agent",
  "boundaries",
  "mcp-gateway",
  "cooperative-ai",
  "ahimsa",
  "astra",
  "governance",
  "wasm",
  "consent",
  "webxr",
]
dependencies = []

[project.optional-dependencies]
signatures = ["cryptography>=42.0"]
wasm = ["wasmtime>=15.0"]
# Benchmark only: the published constraint-cost suite measured by
# benchmarks/safety_gymnasium_runner.py. Never a runtime dependency.
safety-gymnasium = ["safety-gymnasium>=1.0"]
slm = [
  "onnxruntime>=1.17",
  "llama-cpp-python>=0.2",
  "mlx-lm>=0.5",
]
all = ["cryptography>=42.0", "wasmtime>=15.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Dirgha-AI/lokahi"
Repository = "https://github.com/Dirgha-AI/lokahi"
Documentation = "https://github.com/Dirgha-AI/lokahi#readme"
Changelog = "https://github.com/Dirgha-AI/lokahi/blob/main/CHANGELOG.md"

[project.scripts]
lokahi = "lokahi.mcp_stdio_proxy:main"
lokahi-gate = "lokahi.mcp_stdio_proxy:main"
lokahi-gateway = "lokahi.mcp_stdio_proxy:main"
lokahi-sign = "lokahi.lokahi_sign:main"
lokahi-approve = "lokahi.lokahi_approve:main"
lokahi-conformance = "lokahi.conformance:main"
lokahi-vla-verify = "lokahi.vla.rollout_receipt:main"

[tool.setuptools]
package-dir = {"lokahi" = "tools"}
packages = ["lokahi", "lokahi.decisions", "lokahi.vla", "lokahi.vla.adapters"]

[tool.setuptools.package-data]
"lokahi.decisions" = ["model.json"]
